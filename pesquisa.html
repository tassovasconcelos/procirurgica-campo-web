<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#C81E28"><title>Pesquisa ProCuidar</title><link rel="stylesheet" href="/style.css"></head><body><main class="content pesquisa-publica"><section class="card"><div class="eyebrow">GRUPO PROHOSPITAL</div><h1>ProCuidar</h1><p>Como foi seu atendimento?</p><div class="notice">Pesquisa de homologação. Use somente respostas fictícias. Não informe nome, documentos ou informações de saúde no comentário.</div><form id="pesquisa-direta"><label class="field">Em uma escala de 0 a 10, quanto você recomendaria o programa ProCuidar?<select name="nota" required><option value="">Selecione</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label><label class="field">Quem está respondendo?<select name="respondente"><option value="paciente">Paciente</option><option value="familiar">Familiar</option><option value="cuidador">Cuidador</option></select></label><label class="field">O que podemos melhorar? (opcional)<textarea name="comentario" maxlength="1000" rows="4"></textarea></label><label class="check"><input type="checkbox" required>Confirmo minha resposta fictícia para esta pesquisa.</label><button class="btn primary full" type="submit">Enviar avaliação</button></form><p id="pesquisa-status" role="status" aria-live="polite"></p></section></main><script type="module" src="/pesquisa-direta.js"></script></body></html>
