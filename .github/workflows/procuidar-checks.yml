name: ProCuidar checks
on:
  push:
    branches: [feat/crm-cuidado-juridico-v2, feat/procuidar-visitas-qualidade, feat/procuidar-metas-consumo-pesquisas, main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and validation
        run: |
          for file in *.js; do node --experimental-default-type=module --check "$file"; done
          node --experimental-default-type=module tests/procuidar-formularios.test.mjs
          node --experimental-default-type=module tests/visitas.test.mjs
          node --experimental-default-type=module tests/acompanhamento.test.mjs
      - name: Browser dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser mobile and regression
        run: |
          node --experimental-default-type=module tests/procuidar-browser.mjs
          node --experimental-default-type=module tests/procuidar-evolucao-browser.mjs
          node --experimental-default-type=module tests/procuidar-quatro-frentes-browser.mjs
  verify-hostinger:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published modules
        run: node tests/verify-hostinger.mjs
